<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satılık Premium Domain | helalkazanc.com</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --whatsapp-color: #25D366;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 50px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        .status {
            display: inline-block;
            background-color: #e9ecef;
            color: #6c757d;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .domain-name {
            font-size: 2.8em;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 5px;
            word-wrap: break-word;
            letter-spacing: -1px;
        }
        .price {
            font-size: 3.5em;
            font-weight: 700;
            color: #27ae60;
            margin: 15px 0 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .price span {
            font-size: 0.5em;
            color: #7f8c8d;
            font-weight: 500;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-bottom: 40px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        .contact-btn:hover {
            background-color: #1ebe57;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }
        .contact-btn svg {
            margin-right: 12px;
            width: 26px;
            height: 26px;
        }
        .other-domains {
            border-top: 1px solid #eee;
            padding-top: 25px;
            text-align: left;
        }
        .other-domains h3 {
            font-size: 1em;
            color: #7f8c8d;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .domain-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .domain-list li {
            background-color: #f8f9fa;
            border: 1px solid #e2e8f0;
            color: #34495e;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .domain-list li:hover {
            background-color: #e2e8f0;
        }
        @media (max-width: 480px) {
            .domain-name { font-size: 2.2em; }
            .price { font-size: 2.8em; }
            .container { padding: 40px 25px; }
        }
    </style>
</head>
